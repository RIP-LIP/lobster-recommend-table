<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>脑叶公司 · 异想体推荐表 & 加班计算器</title>
<meta name="description" content="异想体收录与工作推荐表，支持搜索与多维筛选；含员工工作属性加成估算器。">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div class="brand-text">
        <h1><span data-i18n="h1a">异想体推荐表</span> <span class="amp" data-i18n="h1amp">&amp;</span> <span data-i18n="h1b">加班计算器</span></h1>
        <p class="sub" id="brandSub"></p>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab is-on" data-view="list" role="tab" data-i18n="tabList">推荐表</button>
      <button class="tab" data-view="calc" role="tab" data-i18n="tabCalc">加班计算器</button>
      <button class="tab" data-view="help" role="tab" data-i18n="tabHelp">表格说明</button>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button class="lang-b is-on" data-lang="zh">中文</button>
      <button class="lang-b" data-lang="en">EN</button>
    </div>
  </div>
</header>

<main>

<!-- ============================================================ 推荐表 -->
<section class="view is-on" id="view-list">

  <div class="toolbar">
    <div class="search-wrap">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 104.47 9.97l4.26 4.26 1.41-1.41-4.26-4.26A6 6 0 0010 4zm0 2a4 4 0 110 8 4 4 0 010-8z"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="搜索编号、名称或任意备注文字（空格分隔多个关键词）" data-i18n-ph="searchPh">
      <button class="clear-x" id="qClear" type="button" aria-label="清空搜索" data-i18n-attr="aria-label:clearSearch" hidden>&times;</button>
    </div>
    <div class="tool-right">
      <div class="srt" id="srt">
        <button type="button" class="srt-b" id="srtBtn" aria-haspopup="listbox" aria-expanded="false">
          <span class="srt-k" data-i18n="sortK">排序</span><span class="srt-v" id="srtVal">原表顺序</span><span class="srt-a" id="srtArrow">▲</span>
        </button>
        <div class="srt-m" id="srtMenu" role="listbox" hidden></div>
      </div>
      <div class="seg" role="group" aria-label="显示方式" data-i18n-attr="aria-label:viewTable">
        <button class="seg-b is-on" data-view-mode="table" data-i18n="viewTable">表格</button>
        <button class="seg-b" data-view-mode="card" data-i18n="viewCard">卡片</button>
      </div>
    </div>
  </div>

  <details class="filters" id="filterPanel" open>
    <summary>
      <span data-i18n="filterTitle">筛选条件</span>
      <span class="f-count" id="fCount">未启用</span>
    </summary>
    <div class="f-body">
      <div class="f-grid" id="fGrid"></div>
      <div class="f-range">
        <label for="dpsMin"><span data-i18n="dpsMinK">武器 DPS 下限：</span><b id="dpsMinVal">0</b></label>
        <input type="range" id="dpsMin" min="0" max="35" step="1" value="0">
        <span class="hint" data-i18n="dpsHint">只统计原表写了 DPS 的武器</span>
      </div>
      <div class="f-foot">
        <button class="btn-ghost" id="clearAll" type="button" data-i18n="clearAll">清除全部筛选</button>
        <span class="f-stat" id="stat">— / — 条</span>
      </div>
    </div>
  </details>

  <div class="active-chips" id="chips"></div>

  <div id="result"></div>

  <div class="empty" id="empty" hidden>
    <p class="empty-t" data-i18n="emptyT">没有符合条件的异想体</p>
    <p class="empty-s" data-i18n="emptyS">试着放宽筛选，或清空搜索关键词。</p>
  </div>
</section>

<!-- ======================================================= 加班计算器 -->
<section class="view" id="view-calc">
  <div class="calc-grid">

    <div class="panel">
      <h2 class="p-h" data-i18n="calcIn">输入区</h2>

      <label class="switch">
        <input type="checkbox" id="tech" checked>
        <span class="sw-track"><span class="sw-dot"></span></span>
        <span class="sw-txt"><span data-i18n="techK">培训部科技</span><b data-i18n="techSub">「普及培训手册」</b></span>
      </label>

      <div class="fld">
        <label for="qual" data-i18n="qualK">员工品质</label>
        <select id="qual"></select>
      </div>

      <div class="fld">
        <label for="lvl" data-i18n="lvlK">工作异想体等级</label>
        <select id="lvl"></select>
      </div>

      <div class="fld">
        <label for="target" data-i18n="targetK">想提升的属性点数</label>
        <select id="target"></select>
      </div>

      <p class="note-warn" id="techNote"></p>
    </div>

    <div class="panel">
      <h2 class="p-h" data-i18n="calcOut">输出区</h2>
      <div class="formula" id="formula"></div>
      <div class="results">
        <div class="res">
          <div class="res-k" data-i18n="resPer">单次工作期望属性加成</div>
          <div class="res-v" id="rPer">—</div>
        </div>
        <div class="res res-hi">
          <div class="res-k" id="rCntK"></div>
          <div class="res-v" id="rCnt">—</div>
          <div class="res-u" data-i18n="resTimes">次</div>
        </div>
      </div>
      <p class="note" id="calcNote"></p>
    </div>

    <div class="panel panel-wide">
      <h2 class="p-h"><span data-i18n="mxTitle">工作系数表</span><span class="p-h-sub" data-i18n="mxSub"></span></h2>
      <div class="mx-wrap"><table class="mx" id="mx"></table></div>
      <p class="note" data-i18n="mxNote"></p>
    </div>

  </div>
</section>

<!-- ======================================================= 表格说明 -->
<section class="view" id="view-help">
  <div class="help">
    <div class="panel">
      <h2 class="p-h" data-i18n="helpDoc">字段说明</h2>
      <div class="tbl-wrap">
        <table class="doc">
          <thead><tr id="docHead"></tr></thead>
          <tbody id="docBody"></tbody>
        </table>
      </div>
    </div>

    <div class="panel" id="legendPanel">
      <h2 class="p-h"><span data-i18n="helpLegend">推荐度标准</span><span class="p-h-sub" data-i18n="helpLegendSub"></span></h2>
      <div class="legend" id="legend"></div>
    </div>

    <div class="panel">
      <h2 class="p-h"><span data-i18n="helpNotice">加班计算器使用须知</span><span class="p-h-sub" data-i18n="helpNoticeSub"></span></h2>
      <div class="notice" id="notice"></div>
    </div>
  </div>
</section>

</main>

<footer class="foot">
  <span data-i18n="foot1">内容为个人向整理，非官方数据。</span>
  <span id="foot2"></span>
  <span id="foot3"></span>
</footer>

<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
